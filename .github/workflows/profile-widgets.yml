name: Actualizar widgets del perfil

on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'
  push:
    branches: [main]
    paths:
      - scripts/update_widgets.py
      - .github/workflows/profile-widgets.yml

permissions:
  contents: write

concurrency:
  group: profile-widgets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leer repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Generar tarjetas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: DavidCevallos15
        run: python scripts/update_widgets.py
      - name: Guardar tarjetas actualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg assets/languages.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: actualizar widgets del perfil"
          git push origin HEAD:main
