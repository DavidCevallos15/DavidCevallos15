<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">David Cevallos · Full-Stack Developer · Ecuador</title>
  <desc id="desc">Software que conecta con las personas. Ilustración animada de una señal que conecta interfaz, API y datos.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e2b"/><stop offset="1" stop-color="#081119"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#73e2c4" stroke-opacity=".055"/></pattern>
    <linearGradient id="mint"><stop stop-color="#73e2c4"/><stop offset="1" stop-color="#8cbcff"/></linearGradient>
    <style>
      .signal {stroke-dasharray:90 900; animation:travel 9s linear infinite}
      .pulse {transform-origin:790px 210px; animation:pulse 4s ease-out infinite}
      .cursor {animation:blink 1.6s steps(2,end) infinite}
      @keyframes travel {from{stroke-dashoffset:990}to{stroke-dashoffset:0}}
      @keyframes pulse {0%{transform:scale(.9);opacity:.5}85%,100%{transform:scale(1.5);opacity:0}}
      @keyframes blink {50%{opacity:0}}
      @media(prefers-reduced-motion:reduce){.signal,.pulse,.cursor{animation:none}.pulse{opacity:.2}}
    </style>
  </defs>
  <rect width="960" height="380" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="378" rx="21" fill="url(#grid)" stroke="#273847"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="40" y="32" width="64" height="34" rx="8" fill="#16392f"/>
    <text x="53" y="55" fill="#73e2c4" font-size="21" font-weight="650">dc /</text>
    <text x="122" y="54" fill="#a9bac7" font-size="12" letter-spacing="2">DISEÑO · CÓDIGO · PROPÓSITO</text>
    <circle cx="800" cy="48" r="4" fill="#73e2c4"/>
    <text x="815" y="53" fill="#a9bac7" font-size="12" letter-spacing="1">ECUADOR</text>
    <text x="40" y="145" fill="#edf4f7" font-size="66" font-weight="700" letter-spacing="-3">David Cevallos<tspan class="cursor" fill="#73e2c4">_</tspan></text>
    <text x="43" y="184" fill="#73e2c4" font-size="19" letter-spacing="3">FULL-STACK DEVELOPER</text>
    <text x="40" y="246" fill="#e0eaf0" font-size="29" font-weight="400">Software que conecta</text>
    <text x="40" y="282" fill="#e0eaf0" font-size="29" font-weight="400">con las personas.</text>
    <path d="M40 316H575" stroke="#273847"/>
    <text x="40" y="346" fill="#a9bac7" font-size="14">SALUD</text><circle cx="106" cy="341" r="2" fill="#73e2c4"/>
    <text x="123" y="346" fill="#a9bac7" font-size="14">EDUCACIÓN</text><circle cx="225" cy="341" r="2" fill="#73e2c4"/>
    <text x="242" y="346" fill="#a9bac7" font-size="14">IA APLICADA</text>
    <path d="M640 80V340" stroke="#273847"/>
    <text x="685" y="100" fill="#728999" font-size="11" letter-spacing="2">DE LA INTERFAZ AL SISTEMA</text>
    <circle cx="790" cy="210" r="74" fill="none" stroke="#20382f"/>
    <circle class="pulse" cx="790" cy="210" r="60" fill="none" stroke="#73e2c4"/>
    <path d="M678 210H716L728 191L742 236L758 167L780 249L796 210H907" fill="none" stroke="#26483f" stroke-width="3" stroke-linejoin="round"/>
    <path class="signal" d="M678 210H716L728 191L742 236L758 167L780 249L796 210H907" fill="none" stroke="url(#mint)" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#10221f" stroke="#39594d">
      <rect x="674" y="294" width="64" height="32" rx="8"/><rect x="756" y="294" width="64" height="32" rx="8"/><rect x="838" y="294" width="72" height="32" rx="8"/>
    </g>
    <g fill="#b8d5cb" font-size="12" text-anchor="middle"><text x="706" y="315">UI</text><text x="788" y="315">API</text><text x="874" y="315">DATA</text></g>
  </g>
</svg>
